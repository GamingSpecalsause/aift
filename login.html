<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-box">
        <div class="auth-header">
            <h1>로그인</h1>
            <p style="color:var(--text-muted)">다시 오신 것을 환영합니다</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="userid" placeholder="아이디" required>
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="password" style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:0.5rem;" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem;">로그인</button>
        </form>
        <div class="auth-footer">
            계정이 없으신가요? <a href="signup.html" class="auth-link">회원가입</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        (async () => {
            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const id = document.getElementById('userid').value;
                const pw = document.getElementById('password').value;

                const result = await loginUser(id, pw);
                if (result.success) {
                    location.href = 'index.html';
                } else {
                    alert(result.message);
                }
            };
        })();
    </script>
</body>
</html>

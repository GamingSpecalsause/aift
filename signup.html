<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-box">
        <div class="auth-header">
            <h1>회원가입</h1>
            <p style="color:var(--text-muted)">보안을 위해 숫자와 특수문자를 포함해주세요</p>
        </div>
        <form id="signup-form">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="userid" placeholder="아이디 입력" required>
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="password" style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:0.5rem;" placeholder="숫자 + 특수문자 포함 8자 이상" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem;">가입하기</button>
        </form>
        <div class="auth-footer" style="margin-top:20px; font-size:0.75rem; color:#ef4444;">
            * 'admin' 아이디는 관리자 전용으로 가입이 제한됩니다.
        </div>
        <div class="auth-footer">
            이미 계정이 있으신가요? <a href="login.html" class="auth-link">로그인</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        (async () => {
            document.getElementById('signup-form').onsubmit = async (e) => {
                e.preventDefault();
                const id = document.getElementById('userid').value;
                const pw = document.getElementById('password').value;

                const result = await registerUser(id, pw);
                if (result.success) {
                    alert('회원가입이 완료되었습니다!');
                    location.href = 'login.html';
                } else {
                    alert(result.message);
                }
            };
        })();
    </script>
</body>
</html>

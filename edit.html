<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 수정하기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>게시글 수정</h1>
            <a href="index.html" class="btn btn-outline">취소</a>
        </header>

        <form id="edit-form">
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="edit-title" required>
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea id="edit-content" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem;">수정 완료</button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const post = await getPost(postId);
            const user = getCurrentUser();

            if (!post || !user || post.userId !== user.id) {
                alert('수정 권한이 없습니다.');
                location.href = 'index.html';
                return;
            } else {
                document.getElementById('edit-title').value = post.title;
                document.getElementById('edit-content').value = post.content;
            }

            document.getElementById('edit-form').onsubmit = async (e) => {
                e.preventDefault();
                const newTitle = document.getElementById('edit-title').value;
                const newContent = document.getElementById('edit-content').value;

                if (await updatePost(postId, newTitle, newContent)) {
                    alert('게시글이 수정되었습니다.');
                    location.href = `post.html?id=${postId}`;
                }
            };
        })();
    </script>
</body>
</html>

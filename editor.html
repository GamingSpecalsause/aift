<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글쓰기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>새 글 작성</h1>
            <a href="index.html" class="btn btn-outline">취소</a>
        </header>

        <form id="post-form">
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="title" placeholder="제목을 입력하세요" required>
            </div>
            <div class="form-group">
                <label>작성자 (현재 닉네임)</label>
                <input type="text" id="author-display" readonly style="background:#f1f5f9; cursor:not-allowed;">
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem;">게시하기</button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        (async () => {
            const user = getCurrentUser();
            if (!user) {
                alert('로그인이 필요한 서비스입니다.');
                location.href = 'login.html';
                return;
            }
            
            document.getElementById('author-display').value = user.nickname;

            document.getElementById('post-form').onsubmit = async (e) => {
                e.preventDefault();
                const title = document.getElementById('title').value;
                const content = document.getElementById('content').value;

                const result = await createPost(title, content, user.id);
                if (result.success) {
                    location.href = `post.html?id=${result.id}`;
                } else {
                    alert(result.message || '작성 오류가 발생했습니다.');
                }
            };
        })();
    </script>
</body>
</html>
